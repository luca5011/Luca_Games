<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 게임 갤러리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-narrow">
    <div class="auth-card">
      <h2>로그인</h2>
      <p class="subtitle">게임을 플레이하려면 로그인하세요</p>

      <div class="field">
        <label for="email">아이디 (관리자는 luca1234)</label>
        <input id="email" type="text" placeholder="이메일 또는 luca1234">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호">
      </div>

      <button id="login-btn" class="btn-primary">로그인</button>
      <p id="msg"></p>

      <div class="auth-footer">
        계정이 없으신가요? <a href="signup.html">회원가입</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { neon, ADMIN_EMAIL } from './neonClient.js';

    const msg = document.getElementById('msg');

    function toRealEmail(input) {
      return input === 'luca1234' ? ADMIN_EMAIL : input;
    }

    function redirectByRole(email) {
      location.href = (email === ADMIN_EMAIL) ? 'admin.html' : 'index.html';
    }

    (async () => {
      const { data } = await neon.auth.getSession();
      if (data?.session) redirectByRole(data.session.user.email);
    })();

    document.getElementById('login-btn').onclick = async () => {
      const rawInput = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!rawInput || !password) {
        msg.className = '';
        msg.textContent = '아이디(이메일)와 비밀번호를 입력하세요.';
        return;
      }

      const email = toRealEmail(rawInput);
      const { error } = await neon.auth.signIn.email({ email, password });

      if (error) {
        msg.className = '';
        msg.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
        return;
      }

      redirectByRole(email);
    };
  </script>

</body>
</html>
