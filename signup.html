<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 80px auto; }
    input { display: block; width: 100%; margin-bottom: 12px; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; cursor: pointer; }
    #msg { margin-top: 12px; }
  </style>
</head>
<body>

  <h2>회원가입</h2>
  <input id="email" type="email" placeholder="이메일">
  <input id="password" type="password" placeholder="비밀번호 (8자 이상)">
  <button id="signup-btn">가입하기</button>
  <p id="msg"></p>
  <p><a href="login.html">로그인 페이지로</a></p>

  <script type="module">
    import { neon } from './neonClient.js';

    const msg = document.getElementById('msg');

    document.getElementById('signup-btn').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        msg.style.color = 'red';
        msg.textContent = '이메일과 비밀번호를 입력하세요.';
        return;
      }

      const { error } = await neon.auth.signUp.email({ email, password });

      if (error) {
        msg.style.color = 'red';
        msg.textContent = error.message;
        return;
      }

      msg.style.color = 'green';
      msg.textContent = '가입 완료! 로그인 페이지로 이동합니다...';
      setTimeout(() => location.href = 'login.html', 1200);
    };
  </script>

</body>
</html>
