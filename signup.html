<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 페이지</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    input { display: block; width: 100%; margin-bottom: 8px; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>

  <div style="display:flex; justify-content:space-between;">
    <h2>관리자 페이지 (luca1234)</h2>
    <button id="logout-btn">로그아웃</button>
  </div>

  <h3>게임 추가</h3>
  <input id="title" placeholder="게임 제목">
  <input id="loaderUrl" placeholder="loader.js URL">
  <input id="dataUrl" placeholder="data URL">
  <input id="frameworkUrl" placeholder="framework.js URL">
  <input id="codeUrl" placeholder="wasm URL">
  <button id="add-btn">추가</button>

  <h3>게임 목록</h3>
  <ul id="game-list"></ul>

  <script type="module">
    import { neon } from './neonClient.js';

    const ADMIN_EMAIL = 'luca1234@admin.local';

    const { data } = await neon.auth.getSession();
    if (!data?.session || data.session.user.email !== ADMIN_EMAIL) {
      location.href = 'login.html';
    }

    document.getElementById('logout-btn').onclick = async () => {
      await neon.auth.signOut();
      location.href = 'login.html';
    };

    document.getElementById('add-btn').onclick = async () => {
      const payload = {
        title: document.getElementById('title').value,
        loader_url: document.getElementById('loaderUrl').value,
        data_url: document.getElementById('dataUrl').value,
        framework_url: document.getElementById('frameworkUrl').value,
        code_url: document.getElementById('codeUrl').value,
      };
      if (!payload.title || !payload.loader_url) {
        alert('제목과 loader URL은 필수입니다.');
        return;
      }
      const { error } = await neon.from('games').insert(payload);
      if (error) return alert(error.message);
      ['title','loaderUrl','dataUrl','frameworkUrl','codeUrl'].forEach(id => document.getElementById(id).value = '');
      loadGames();
    };

    async function loadGames() {
      const { data: games } = await neon.from('games').select();
      const list = document.getElementById('game-list');
      list.innerHTML = '';
      games?.forEach(g => {
        const li = document.createElement('li');
        li.textContent = `${g.title} `;
        const btn = document.createElement('button');
        btn.textContent = '삭제';
        btn.onclick = async () => {
          await neon.from('games').delete().eq('id', g.id);
          loadGames();
        };
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    loadGames();
  </script>

</body>
</html>
