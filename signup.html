<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 게임 갤러리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-narrow">
    <div class="auth-card">
      <h2>회원가입</h2>
      <p class="subtitle">가입하면 게임을 플레이하고 댓글을 남길 수 있어요</p>

      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" placeholder="8자 이상">
      </div>

      <button id="signup-btn" class="btn-primary">가입하기</button>
      <p id="msg"></p>

      <div class="auth-footer">
        이미 계정이 있으신가요? <a href="login.html">로그인</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { neon } from './neonClient.js';

    const msg = document.getElementById('msg');

    document.getElementById('signup-btn').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        msg.className = '';
        msg.textContent = '이메일과 비밀번호를 입력하세요.';
        return;
      }

      const { error } = await neon.auth.signUp.email({ email, password });

      if (error) {
        msg.className = '';
        msg.textContent = error.message;
        return;
      }

      msg.className = 'success';
      msg.textContent = '가입 완료! 로그인 페이지로 이동합니다...';
      setTimeout(() => location.href = 'login.html', 1200);
    };
  </script>

</body>
</html>
