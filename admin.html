<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 · 게임 갤러리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <div class="navbar">
      <h2>관리자 페이지</h2>
      <div class="navbar-right">
        <span>luca1234</span>
        <button id="logout-btn" class="btn-ghost btn-small">로그아웃</button>
      </div>
    </div>

    <div class="form-card">
      <h3>게임 추가</h3>
      <div class="form-grid">
        <div class="field full">
          <label for="title">게임 제목</label>
          <input id="title" type="text" placeholder="예: 우주 탈출 대작전">
        </div>
        <div class="field full">
          <label for="description">설명 (선택)</label>
          <input id="description" type="text" placeholder="한 줄 소개">
        </div>
        <div class="field">
          <label for="loaderUrl">loader.js URL</label>
          <input id="loaderUrl" type="text" placeholder="https://.../game.loader.js">
        </div>
        <div class="field">
          <label for="dataUrl">data URL</label>
          <input id="dataUrl" type="text" placeholder="https://.../game.data">
        </div>
        <div class="field">
          <label for="frameworkUrl">framework.js URL</label>
          <input id="frameworkUrl" type="text" placeholder="https://.../game.framework.js">
        </div>
        <div class="field">
          <label for="codeUrl">wasm URL</label>
          <input id="codeUrl" type="text" placeholder="https://.../game.wasm">
        </div>
      </div>
      <button id="add-btn" class="btn-primary" style="width:auto;">게임 추가</button>
    </div>

    <section>
      <h3>등록된 게임</h3>
      <ul id="game-list" class="manage-list"></ul>
    </section>
  </div>

  <script type="module">
    import { neon, ADMIN_EMAIL } from './neonClient.js';

    const { data } = await neon.auth.getSession();
    if (!data?.session || data.session.user.email !== ADMIN_EMAIL) {
      location.href = 'login.html';
    }

    document.getElementById('logout-btn').onclick = async () => {
      await neon.auth.signOut();
      location.href = 'login.html';
    };

    document.getElementById('add-btn').onclick = async () => {
      const payload = {
        title: document.getElementById('title').value.trim(),
        description: document.getElementById('description').value.trim(),
        loader_url: document.getElementById('loaderUrl').value.trim(),
        data_url: document.getElementById('dataUrl').value.trim(),
        framework_url: document.getElementById('frameworkUrl').value.trim(),
        code_url: document.getElementById('codeUrl').value.trim(),
      };

      if (!payload.title || !payload.loader_url || !payload.data_url || !payload.framework_url || !payload.code_url) {
        alert('제목과 4개 URL은 모두 필수입니다.');
        return;
      }

      const { error } = await neon.from('games').insert(payload);
      if (error) return alert(error.message);

      ['title','description','loaderUrl','dataUrl','frameworkUrl','codeUrl']
        .forEach(id => document.getElementById(id).value = '');
      loadGames();
    };

    async function loadGames() {
      const { data: games, error } = await neon.from('games').select();
      if (error) { console.error(error); return; }

      const list = document.getElementById('game-list');
      list.innerHTML = '';

      if (!games?.length) {
        list.innerHTML = '<li class="empty-state" style="width:100%;">아직 등록된 게임이 없어요.</li>';
        return;
      }

      games.forEach(g => {
        const li = document.createElement('li');

        const span = document.createElement('span');
        span.className = 'game-title';
        span.textContent = g.title;

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-danger';
        delBtn.textContent = '삭제';
        delBtn.onclick = async () => {
          if (!confirm(`"${g.title}" 삭제할까요?`)) return;
          await neon.from('games').delete().eq('id', g.id);
          loadGames();
        };

        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    loadGames();
  </script>

</body>
</html>
