<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자</title>
</head>
<body>

  <div id="auth-forms">
    <h3>회원가입</h3>
    <input id="signup-email" placeholder="이메일">
    <input id="signup-password" type="password" placeholder="비밀번호">
    <button id="signup-btn">가입</button>

    <h3>로그인</h3>
    <input id="login-email" placeholder="이메일">
    <input id="login-password" type="password" placeholder="비밀번호">
    <button id="login-btn">로그인</button>
  </div>

  <div id="admin-panel" style="display:none;">
    <p>로그인됨: <span id="user-email"></span></p>
    <button id="logout-btn">로그아웃</button>

    <h3>게임 추가</h3>
    <input id="title" placeholder="게임 제목">
    <input id="loaderUrl" placeholder="loader.js URL">
    <input id="dataUrl" placeholder="data URL">
    <input id="frameworkUrl" placeholder="framework.js URL">
    <input id="codeUrl" placeholder="wasm URL">
    <button id="add-btn">추가</button>

    <ul id="game-list"></ul>
  </div>

  <script type="module">
    import { neon } from './neonClient.js';

    async function checkSession() {
      const { data } = await neon.auth.getSession();
      if (data?.session) {
        document.getElementById('auth-forms').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('user-email').textContent = data.session.user.email;
        loadGames();
      }
    }

    document.getElementById('signup-btn').onclick = async () => {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const { error } = await neon.auth.signUp.email({ email, password });
      if (error) return alert(error.message);
      alert('가입 완료. 로그인 해주세요.');
    };

    document.getElementById('login-btn').onclick = async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { error } = await neon.auth.signIn.email({ email, password });
      if (error) return alert(error.message);
      checkSession();
    };

    document.getElementById('logout-btn').onclick = async () => {
      await neon.auth.signOut();
      location.reload();
    };

    document.getElementById('add-btn').onclick = async () => {
      const payload = {
        title: document.getElementById('title').value,
        loader_url: document.getElementById('loaderUrl').value,
        data_url: document.getElementById('dataUrl').value,
        framework_url: document.getElementById('frameworkUrl').value,
        code_url: document.getElementById('codeUrl').value,
      };
      const { error } = await neon.from('games').insert(payload);
      if (error) return alert(error.message);
      loadGames();
    };

    async function loadGames() {
      const { data } = await neon.from('games').select();
      const list = document.getElementById('game-list');
      list.innerHTML = '';
      data?.forEach(g => {
        const li = document.createElement('li');
        li.textContent = `${g.title} `;
        const btn = document.createElement('button');
        btn.textContent = '삭제';
        btn.onclick = async () => {
          await neon.from('games').delete().eq('id', g.id);
          loadGames();
        };
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    checkSession();
  </script>

</body>
</html>
