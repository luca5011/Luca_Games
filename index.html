<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게임 갤러리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <div class="navbar">
      <h2>게임 갤러리</h2>
      <div class="navbar-right">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn-ghost btn-small">로그아웃</button>
      </div>
    </div>

    <ul id="game-list" class="game-grid"></ul>

    <div id="unity-container" style="display:none;">
      <canvas id="unity-canvas"></canvas>
    </div>

    <div id="comments-section" style="display:none;">
      <h3>댓글</h3>
      <ul id="comment-list"></ul>
      <div class="comment-form">
        <input id="comment-input" type="text" placeholder="댓글을 남겨보세요">
        <button id="comment-submit" class="btn-primary" style="width:auto;">등록</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { neon } from './neonClient.js';

    let currentGameId = null;

    const { data } = await neon.auth.getSession();
    if (!data?.session) {
      location.href = 'login.html';
    }
    document.getElementById('user-email').textContent = data.session.user.email;

    document.getElementById('logout-btn').onclick = async () => {
      await neon.auth.signOut();
      location.href = 'login.html';
    };

    async function loadGameList() {
      const { data: games, error } = await neon.from('games').select();
      if (error) { console.error(error); return; }

      const list = document.getElementById('game-list');
      list.innerHTML = '';

      if (!games?.length) {
        list.innerHTML = '<li class="empty-state" style="grid-column:1/-1;">아직 등록된 게임이 없어요. 관리자가 곧 추가할 예정이에요.</li>';
        return;
      }

      games.forEach(g => {
        const li = document.createElement('li');
        const card = document.createElement('button');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="marquee"></div>
          <div class="title">${g.title}</div>
          <div class="desc">${g.description || '플레이해보세요'}</div>
        `;
        card.onclick = () => playGame(g);
        li.appendChild(card);
        list.appendChild(li);
      });
    }

    function playGame(game) {
      currentGameId = game.id;
      document.getElementById('unity-container').style.display = 'block';
      document.getElementById('comments-section').style.display = 'block';

      const config = {
        dataUrl: game.data_url,
        frameworkUrl: game.framework_url,
        codeUrl: game.code_url,
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'MyCompany',
        productName: game.title,
        productVersion: '1.0',
      };

      const canvas = document.querySelector('#unity-canvas');
      const script = document.createElement('script');
      script.src = game.loader_url;
      script.onload = () => {
        createUnityInstance(canvas, config).catch(err => alert(err));
      };
      document.body.appendChild(script);

      document.getElementById('unity-container').scrollIntoView({ behavior: 'smooth' });
      loadComments();
    }

    // Unity 쪽에서 SendMessage('WebGameBridge', 'RecordScore', '123') 형태로 호출
    window.RecordScore = async (scoreValue) => {
      if (!currentGameId) return;
      const score = parseInt(scoreValue, 10);
      if (Number.isNaN(score)) return;

      const { error } = await neon.from('scores').insert({ game_id: currentGameId, score });
      if (error) console.error(error);
    };

    document.getElementById('comment-submit').onclick = async () => {
      const input = document.getElementById('comment-input');
      const content = input.value.trim();
      if (!content || !currentGameId) return;

      const { error } = await neon.from('comments').insert({ game_id: currentGameId, content });
      if (error) return alert(error.message);

      input.value = '';
      loadComments();
    };

    async function loadComments() {
      if (!currentGameId) return;
      const { data: comments, error } = await neon
        .from('comments')
        .select()
        .eq('game_id', currentGameId);
      if (error) { console.error(error); return; }

      const list = document.getElementById('comment-list');
      list.innerHTML = '';

      if (!comments?.length) {
        list.innerHTML = '<li style="color:var(--text-muted); border-bottom:none;">아직 댓글이 없어요. 첫 댓글을 남겨보세요.</li>';
        return;
      }

      comments.forEach(c => {
        const li = document.createElement('li');
        li.textContent = c.content;
        list.appendChild(li);
      });
    }

    loadGameList();
  </script>

</body>
</html>
